# ==============================================================================
# ResolveIQ Local Development Docker Compose Setup
# ==============================================================================
# Usage:
#   1. Copy .env.example to .env and configure secrets:
#        cp .env.example .env
#   2. Build and launch services:
#        docker compose up -d --build
#   3. View container logs:
#        docker compose logs -f api
#   4. Check service health:
#        docker compose ps
#   5. Stop containers without deleting data:
#        docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: resolveiq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveiq_db}
      POSTGRES_USER: ${POSTGRES_USER:-resolveiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInEnvFile123!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveiq_user} -d ${POSTGRES_DB:-resolveiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - resolveiq_network

  # ----------------------------------------------------------------------------
  # ResolveIQ ASP.NET Core Web API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolveiq-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5022}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-resolveiq_db};Username=${POSTGRES_USER:-resolveiq_user};Password=${POSTGRES_PASSWORD:-ChangeMeInEnvFile123!}"
      Jwt__Key: ${JWT_KEY:-change_me_to_at_least_32_bytes_base64_encoded_key_1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-ResolveIQ.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-ResolveIQ.Clients}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      ForwardedHeaders__ForwardAllProxies: ${FORWARDED_HEADERS_ALL_PROXIES:-false}
    networks:
      - resolveiq_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: resolveiq_postgres_data

# ------------------------------------------------------------------------------
# Network Isolation
# ------------------------------------------------------------------------------
networks:
  resolveiq_network:
    name: resolveiq_network
    driver: bridge
